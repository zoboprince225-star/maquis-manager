name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org com.maquis --project-name maquis_manager .
      - name: Autorisations Bluetooth
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT BLUETOOTH_SCAN ACCESS_FINE_LOCATION; do
            sed -i "/<application/i\    <uses-permission android:name=\"android.permission.$P\"/>" $M
          done
      - name: Forcer Android 36 pour les paquets
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maquis-compilesdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.library')) {
                      try {
                          p.android.compileSdk = 36
                      } catch (Throwable t) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
      - run: flutter pub get
      - name: Générer le code de la base
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: maquis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
