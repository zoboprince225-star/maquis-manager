name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAQUIS_KS: /home/runner/maquis-release.jks
      MAQUIS_PASS: maquis-cle-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org com.maquis --project-name maquis_manager .
      - name: Nom de l'application
        run: sed -i 's/android:label="[^"]*"/android:label="Maquis Manager"/' android/app/src/main/AndroidManifest.xml
      - name: Autorisations Bluetooth
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT BLUETOOTH_SCAN ACCESS_FINE_LOCATION; do
            sed -i "/<application/i\    <uses-permission android:name=\"android.permission.$P\"/>" $M
          done
      - name: Forcer Android 36 et désactiver lint
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maquis-compilesdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.library')) {
                      try {
                          p.android.compileSdk = 36
                      } catch (Throwable t) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }
          gradle.taskGraph.whenReady { graph ->
              graph.allTasks.each { t ->
                  if (t.name.toLowerCase().contains('lint')) {
                      t.enabled = false
                  }
              }
          }
          EOF
      - name: Icône de l'application
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          IM=convert
          command -v magick >/dev/null 2>&1 && IM=magick
          $IM -size 1024x1024 xc:'#232647' \
            -fill '#E8801E' -draw 'roundrectangle 300,330 640,790 50,50' \
            -fill none -stroke '#E8801E' -strokewidth 56 -draw 'ellipse 650,560 120,140 270,450' \
            -stroke none -fill '#FFF4DC' -draw 'circle 380,340 380,270' -draw 'circle 470,310 470,230' -draw 'circle 565,340 565,270' -draw 'roundrectangle 300,320 640,380 30,30' \
            -fill '#232647' -draw 'roundrectangle 372,430 402,730 14,14' -draw 'roundrectangle 470,430 500,730 14,14' -draw 'roundrectangle 568,430 598,730 14,14' \
            /tmp/icon.png
          for s in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $s
            $IM /tmp/icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher.png
          done
      - name: Clé de signature (conservée entre les builds)
        uses: actions/cache@v4
        with:
          path: /home/runner/maquis-release.jks
          key: maquis-signing-key-v1
      - name: Créer la clé si elle n'existe pas encore
        run: |
          if [ ! -f "$MAQUIS_KS" ]; then
            keytool -genkeypair -keystore "$MAQUIS_KS" -storepass "$MAQUIS_PASS" -keypass "$MAQUIS_PASS" -alias maquis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Maquis Manager, O=Maquis, C=CI"
          fi
      - name: Activer la signature
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maquis-signing.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      p.android {
                          signingConfigs {
                              maquis {
                                  storeFile new File(System.getenv('MAQUIS_KS'))
                                  storePassword System.getenv('MAQUIS_PASS')
                                  keyAlias 'maquis'
                                  keyPassword System.getenv('MAQUIS_PASS')
                              }
                          }
                          buildTypes {
                              release {
                                  signingConfig signingConfigs.maquis
                              }
                          }
                      }
                  }
              }
          }
          EOF
      - run: flutter pub get
      - name: Générer le code de la base
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Compiler l'APK signé
        id: signed
        continue-on-error: true
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Compiler sans clé stable (secours)
        if: steps.signed.outcome == 'failure'
        run: |
          rm -f ~/.gradle/init.d/maquis-signing.gradle
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: maquis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
